version: 2

models:
  - name: fct_business_monthly_profits
    description: >
      Q1 mart. Monthly profit and sales volume per business, used to spot
      seasonal patterns in profitability.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [business_abn, year, month]
    columns:
      - name: business_abn
        description: Australian Business Number of the business.
        data_tests: [not_null]
      - name: business_name
        description: Business name.
        data_tests: [not_null]
      - name: year
        description: Calendar year of the sales.
        data_tests: [not_null]
      - name: month
        description: Calendar month number (1–12).
        data_tests: [not_null]
      - name: month_name
        description: Full month name.
      - name: total_monthly_profit
        description: Sum of receipt profit for the business in that month (AUD).
      - name: num_of_sales
        description: Number of receipts for the business in that month.
