version: 2

models:
  - name: dim_employee_attendance
    description: >
      Q3 support. Roster of distinct employees (cashiers) active per business
      per month, plus a headcount.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [business_name, year, month]
    columns:
      - name: business_name
        description: Business name.
        data_tests: [not_null]
      - name: year
        description: Calendar year.
        data_tests: [not_null]
      - name: month
        description: Calendar month number (1–12).
        data_tests: [not_null]
      - name: employees
        description: Comma-separated list of employees active that month.
      - name: num_employees
        description: Distinct employees active for the business that month.

  - name: fct_employee_turnover
    description: >
      Q3 mart. Employee turnover per business per fiscal year (July–June),
      computed from receipt activity. The most recent fiscal year is flagged as
      right-censored and its turnover is left NULL (see model header for the
      methodology).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [business_name, fiscal_year]
    columns:
      - name: business_name
        description: Business name.
        data_tests: [not_null]
      - name: fiscal_year
        description: Starting calendar year of the July–June fiscal year.
        data_tests: [not_null]
      - name: fiscal_year_label
        description: Human-readable fiscal year label, e.g. "2022-2023".
      - name: headcount
        description: Distinct employees active for the business that fiscal year.
        data_tests: [not_null]
      - name: num_hired
        description: Employees first observed in that fiscal year.
      - name: num_left
        description: Employees whose last active fiscal year was this one.
      - name: is_censored_period
        description: True for the most recent fiscal year, where departures cannot be observed.
      - name: turnover_rate_pct
        description: num_left / headcount * 100. NULL for the censored final year.
