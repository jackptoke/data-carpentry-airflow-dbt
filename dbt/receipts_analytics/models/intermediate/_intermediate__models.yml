version: 2

# Intermediate models hold the reusable business logic between staging and
# marts. They are materialized as views (see dbt_project.yml) so they stay
# queryable for dashboard "show the working" panels and ad-hoc debugging.
models:
  - name: int_receipt_profits
    description: Cost, revenue and profit rolled up to one row per receipt, after promotions.
  - name: int_business_sales
    description: Receipts enriched with the issuing business and calendar parts (year/month).
  - name: int_business_sales_profits
    description: int_business_sales joined to int_receipt_profits — business context plus profit per receipt.
  - name: int_customer_business_spend
    description: One row per receipt linking a customer to a business and the amount spent.
  - name: int_customer_business_summary
    description: Total spend and purchase count per business + customer.
  - name: int_business_employees
    description: Distinct (business, month, cashier) activity used for headcount and turnover.
  - name: int_business_fiscal_sales
    description: One row per receipt with fiscal year (July–June) and customer, carrying net revenue, COGS and gross profit for the KPI mart.
  - name: int_customer_rfm
    description: Per business + customer, the raw Recency (days since last purchase), Frequency (receipt count) and Monetary (total net revenue) inputs for RFM scoring. Anonymous receipts excluded.
  - name: int_product_sales
    description: Per business + product, units sold with gross/net revenue, cost and profit (discounts applied with the same qualifying-quantity logic as int_receipt_profits).
