name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    name: dbt build + dashboard smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dbt and dashboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-duckdb==1.9.4" "duckdb==1.3.1"
          pip install -r dashboard/requirements.txt

      - name: Seed raw_receipts landing table (mirrors the Airflow ingestion)
        run: python scripts/build_local_db.py

      - name: Install dbt packages
        working-directory: dbt/receipts_analytics
        run: dbt deps

      - name: dbt build (runs every model and data test)
        working-directory: dbt/receipts_analytics
        run: dbt build --target dev --profiles-dir .

      - name: Dashboard smoke test
        run: python scripts/smoke_test_dashboard.py
